name: CI

# La branche principale est `master` (et la branche de travail `wip`).
on:
  push:
    branches: [master, wip]
  pull_request:
  workflow_dispatch:

# Notes communes aux trois jobs :
#   - `submodules: true` est INDISPENSABLE : le compilateur MoonScript est le
#     sous-module backend/vendor/moonscript (tag v0.8.0), et `make build`
#     compile son analyseur natif (moonscript/parse/native.c).
#   - Toute commande `make` passe par `nix develop .#build --command …` : la
#     compilation MoonScript exige l'interpréteur Lua 5.1 du shell Nix avec
#     lpeg/argparse/luafilesystem (TGUI_LUA), les en-têtes de Lua pour
#     native.so et un `coffee` de version déterministe. Hors de ce shell, ces
#     outils viennent du système et peuvent manquer ou diverger.
#   - Nix est installé par cachix/install-nix-action (l'ancien
#     DeterminateSystems/nix-installer-action@v9 échoue avec « Invalid URL »).

jobs:
  # Vérifie que les artefacts commités (.lua/.js) sont en phase avec les sources
  # (.moon/.coffee). Utilise le devShell Nix `.#build` pour un moonc/coffee
  # déterministe (une autre version produirait de faux diffs).
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Compile sources and check artifacts are up to date
        # `make -B` force la recompilation de TOUTES les sources : un `make build`
        # ordinaire est piloté par les dates de fichiers et, sur un clone neuf
        # (tous les artefacts plus récents que leurs sources), ne recompile rien
        # et laisserait passer une désynchronisation. La compilation forcée est
        # donc déterministe et détecte réellement tout écart sources/artefacts.
        run: |
          nix develop .#build --command make -B build
          if ! git diff --exit-code; then
            echo "::error::Artefacts désynchronisés : lance 'nix develop .#build --command make build' et commite."
            exit 1
          fi

  # Vérifs backend + JS + SDL + doc (tournent en conteneur sur les artefacts commités).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Aucune installation Node/npm séparée : le devShell `.#build` fournit
      # nodejs et coffeescript, ce dernier étant appelé directement par le
      # Makefile (`coffee`) et par scripts/moonc.sh.
      - name: make ci (sdl-check + backend tests + JS tests + doc-check)
        # Docker (build, compose) vient du runner et reste visible dans le PATH
        # du shell Nix. Sur les runners GitHub le bridge Docker fonctionne ;
        # --network=host (défaut DOCKER_BUILD_NET) reste valide.
        run: nix develop .#build --command make ci

  # Tests navigateur Playwright contre l'instance de test (port 8081).
  e2e:
    runs-on: ubuntu-latest
    # Deux réglages pour que le build de l'image ne demande pas le privilège
    # `network.host`, que buildx refuse à l'intérieur d'un bake :
    #   - TGUI_BUILD_NETWORK=default : le bridge Docker du runner fait du NAT,
    #     le build (apt-get, tt rocks install, wget) n'a donc pas besoin du
    #     réseau de l'hôte. Le demander fait émettre par compose l'entitlement
    #     `network.host` et le build meurt avec « additional privileges
    #     requested: pass "--allow=network.host" » (run 43845425772).
    #   - COMPOSE_BAKE=false : les compose qui reconnaissent ce commutateur
    #     repassent à leur builder interne, qui accepte `network: host`. Les
    #     compose plus récents l'ignorent (la chaîne est absente du binaire 5.4.0
    #     de Nix), d'où le garde-fou précédent. Même commutateur dans le
    #     Makefile, pour `make up` / `make test-up` en local sous direnv.
    env:
      TGUI_BUILD_NETWORK: default
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS toolchain
        # Installation reproductible : `npm ci` installe exactement les versions
        # verrouillées dans package-lock.json (ici @playwright/test et
        # playwright 1.59.1). Playwright n'est PAS dans le devShell `.#build`
        # (navigateurs trop lourds pour la seule compilation) : il vient de npm
        # et tourne hors du shell Nix. `npm install -g coffeescript` n'est plus
        # nécessaire, `coffee` venant alors de Nix.
        run: npm ci

      - name: Start test instance
        # `make test-up` compile d'abord les sources (`build`) : il faut donc
        # le shell Nix. Le nom de conteneur `tgui-tarantool-test` est unique sur
        # la machine, d'où l'arrêt explicite en fin de job.
        run: |
          nix develop .#build --command make test-up
          # Attendre que l'API réponde
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8081/; then echo "up"; break; fi
            sleep 2
          done

      - name: Install Playwright browser
        # Hors shell Nix : le navigateur téléchargé par npm doit voir les
        # bibliothèques système du runner (--with-deps les installe).
        run: npx playwright install --with-deps chromium

      - name: Compile and run Playwright specs
        run: |
          nix develop .#build --command make playwright-compile
          npx playwright test --config=tests/playwright/playwright-optimized.config.js

      - name: Stop test instance
        if: always()
        run: nix develop .#build --command make test-down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
