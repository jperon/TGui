services:
  tarantool:
    build:
      context: .
      # Le bridge Docker de cet hôte ne fait pas de masquerade (firewall NixOS) :
      # la phase build (tt rocks) a besoin d'un accès réseau sortant, fourni ici
      # par le réseau de l'hôte. Mettre TGUI_BUILD_NETWORK=default (ou retirer
      # cette ligne) si le NAT du bridge est réparé, ou sur un hôte dont le
      # bridge masquerade (voir docker-compose.test.yml et la CI).
      network: ${TGUI_BUILD_NETWORK:-host}
    image: tdb-tarantool
    command: tarantool /app/backend/init.lua
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./schema:/app/schema:ro
      - ./tests:/app/tests:ro
      - tgui_data:/var/lib/tarantool
    ports:
      - "3301:3301"   # Tarantool binary port
      - "8080:8080"   # HTTP GUI port
    environment:
      TT_LOG_LEVEL: "5"

volumes:
  tgui_data:
