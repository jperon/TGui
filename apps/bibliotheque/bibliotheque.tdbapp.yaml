  - content:
      description: "Suivi quotidien des prêts et retours au guichet."
      name: "Prêts et retours"
      yaml: "layout:\n  direction: vertical\n  children:\n  - widget:\n      id: emprunts_en_cours\n      title: Emprunts en cours\n      space: Emprunts en cours\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: lecteurs\n          title: Lecteurs\n          space: Personnes\n          columns: [descriptif, classe_actuelle, emprunts_en_cours]\n      - widget:\n          id: emprunts_lecteur\n          title: Emprunts du lecteur sélectionné\n          space: Emprunts\n          depends_on:\n            widget: lecteurs\n            field: personne\n            from_field: id\n          columns: [ouvrage, emprunt, retour]\n"
    key: "page:Prêts et retours"
    type: "page"
  - content:
      description: "Exploration du catalogue : livres, exemplaires et emprunts."
      name: "Catalogue"
      yaml: "layout:\n  direction: vertical\n  children:\n  - widget:\n      id: livres\n      title: Livres\n      space: Livres\n      columns: [titre, auteur_nom, genre_nom, n_exemplaires, note]\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: exemplaires\n          title: Exemplaires\n          space: Exemplaires\n          depends_on:\n            widget: livres\n            field: livre\n            from_field: id\n          columns: [cote, emprunteur, suppression]\n      - widget:\n          id: emprunts_exemplaire\n          title: Emprunts de l'exemplaire sélectionné\n          space: Emprunts\n          depends_on:\n            widget: exemplaires\n            field: exemplaire\n            from_field: id\n          columns: [lecteur, emprunt, retour]\n"
    key: "page:Catalogue"
    type: "page"
  - content:
      description: "Élèves d'une classe et leurs emprunts."
      name: "Lecteurs et classes"
      yaml: "layout:\n  direction: vertical\n  children:\n  - widget:\n      id: classes\n      title: Classes\n      space: Classes\n      columns: [descriptif_complet, effectif]\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: classes_eleves\n          title: Élèves de la classe sélectionnée\n          space: ClassesEleves\n          depends_on:\n            widget: classes\n            field: classe\n            from_field: id\n          columns: [eleve_nom, entree, depart]\n      - widget:\n          id: emprunts_eleve\n          title: Emprunts de l'élève sélectionné\n          space: Emprunts\n          depends_on:\n            widget: classes_eleves\n            field: personne\n            from_field: eleve\n          columns: [ouvrage, emprunt, retour]\n"
    key: "page:Lecteurs et classes"
    type: "page"
  - content:
      description: "Vue synthétique en grille des indicateurs de la bibliothèque."
      name: "Tableau de bord"
      yaml: "layout:\n  direction: vertical\n  children:\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: dv_emprunts_en_cours\n          title: Emprunts en cours\n          space: Emprunts en cours\n      - widget:\n          id: dv_livres_plus_empruntes\n          title: Livres les plus empruntés\n          space: Livres les plus empruntés\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: dv_emprunts_par_annee\n          title: Emprunts par année\n          space: Emprunts par année\n      - widget:\n          id: dv_livres_par_genre\n          title: Livres par genre\n          space: Livres par genre\n  - layout:\n      direction: horizontal\n      children:\n      - widget:\n          id: dv_effectifs_par_classe\n          title: Effectifs par classe\n          space: Effectifs par classe\n"
    key: "page:Tableau de bord"
    type: "page"
  - content:
      config:
        columns:
          - "lecteur"
          - "ouvrage"
          - "emprunt"
        filter:
          field: "retour"
          op: "EQ"
          value: ""
        orderBy:
          - desc: false
            field: "emprunt"
      description: "Emprunts non rendus, triés par date d'emprunt."
      name: "Emprunts en cours"
      sourceSpace: "Emprunts"
    key: "dataview:Emprunts en cours"
    type: "dataview"
  - content:
      config:
        columns:
          - "cote"
          - "descriptif"
        filter:
          and:
            - field: "emprunteur"
              op: "EQ"
              value: ""
            - field: "suppression"
              op: "EQ"
              value: ""
        orderBy:
          - desc: false
            field: "cote"
      description: "Exemplaires non empruntés et non supprimés, triés par cote."
      name: "Exemplaires disponibles"
      sourceSpace: "Exemplaires"
    key: "dataview:Exemplaires disponibles"
    type: "dataview"
  - content:
      config:
        columns:
          - "cote"
          - "descriptif"
          - "emprunteur"
        filter:
          field: "emprunteur"
          op: "NEQ"
          value: ""
      description: "Exemplaires actuellement prêtés."
      name: "Exemplaires prêtés"
      sourceSpace: "Exemplaires"
    key: "dataview:Exemplaires prêtés"
    type: "dataview"
  - content:
      config:
        columns:
          - "titre"
          - "auteur_nom"
          - "genre_nom"
        filter:
          field: "n_exemplaires"
          op: "EQ"
          value: "0"
      description: "Livres dont aucun exemplaire n'est en rayon."
      name: "Livres sans exemplaire"
      sourceSpace: "Livres"
    key: "dataview:Livres sans exemplaire"
    type: "dataview"
  - content:
      config:
        aggregates:
          - as: "nb_emprunts"
            fn: "count"
        groupBy:
          - "livre_titre"
        limit: 10
        orderBy:
          - desc: true
            field: "nb_emprunts"
      description: "Nombre d'emprunts par titre, du plus emprunté au moins emprunté."
      name: "Livres les plus empruntés"
      sourceSpace: "Emprunts"
    key: "dataview:Livres les plus empruntés"
    type: "dataview"
  - content:
      config:
        aggregates:
