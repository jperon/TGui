services:
  tarantool-test:
    container_name: tgui-tarantool-test
    build:
      context: .
      # Voir docker-compose.yml : le bridge Docker de cet hôte ne masquerade pas,
      # la phase build (tt rocks) passe donc par le réseau de l'hôte. Les
      # runners GitHub, eux, NATent correctement leur bridge : la CI met
      # TGUI_BUILD_NETWORK=default pour ne pas demander le privilège
      # network.host, que buildx refuse dans un bake (« additional privileges
      # requested: pass "--allow=network.host" »).
      network: ${TGUI_BUILD_NETWORK:-host}
    command: tarantool /app/backend/init.lua
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./schema:/app/schema:ro
      - ./tests:/app/tests:ro
    ports:
      - "3302:3301"
      - "8081:8080"
    environment:
      TT_LOG_LEVEL: "5"
      TGUI_TEST_ENV: "true"
    profiles:
      - test

