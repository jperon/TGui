"""
tdb GraphQL Schema
GUI for Tarantool: spaces (tables), views, relations, users, groups, permissions.
"""

# ────────────────────────────────────────────────────────────────────────────
# Root types
# ────────────────────────────────────────────────────────────────────────────

schema {
  query:    Query
  mutation: Mutation
}

type Query {
  # Spaces (user-defined tables)
  spaces:          [Space!]!
  space(id: ID!):  Space

  # Views (per-space)
  views(spaceId: ID!):    [View!]!
  view(id: ID!):          View

  # Custom views (YAML dashboard layouts)
  customViews:            [CustomView!]!
  customView(id: ID!):    CustomView

  # Data views (saved queries)
  dataViews:              [DataView!]!
  dataView(id: ID!):      DataView
  executeDataView(id: ID!, limit: Int, offset: Int): [JSON!]!
  widgetPlugins:          [WidgetPlugin!]!
  widgetPlugin(id: ID, name: String): WidgetPlugin

  # Raw data from a user space
  records(spaceId: ID!, filter: RecordFilter, limit: Int, offset: Int, reprFormula: String, reprLanguage: String): RecordPage!
  record(spaceId: ID!, id: ID!): Record

  # Relations
  relations(spaceId: ID!): [Relation!]!
  gridColumnPrefs(spaceId: ID!): JSON!

  # Aggregation query
  aggregateSpace(
    spaceName: String!
    groupBy:   [String!]!
    aggregate: [AggregateInput!]!
  ): [JSON]

  # Auth
  me: User

  # Admin
  users:           [User!]!
  user(id: ID!):   User
  groups:          [Group!]!
  group(id: ID!):  Group

  # Snapshot export / diff
  exportSnapshot(includeData: Boolean!, compress: Boolean): String!
  diffSnapshot(yaml: String!):           SnapshotDiff!

  # App versioning (admin only)
  listApps: [AppInfo!]!
  appItems(appId: String!): [AppItem!]!
  exportApp(meta: AppMetaInput!, seed: [AppSeedInput!]): String!
  previewAppUpdate(yaml: String!, allowDowngrade: Boolean): AppPlan!
  previewAppPurge(appId: String!, keys: [String!]!): AppPurgePreview!

  # Layout export / import
  exportLayout(pageId: ID!): String!

  # Layout snapshots
  listLayoutSnapshots(pageId: ID!): [LayoutSnapshot!]!
}

type Mutation {
  # Spaces
  createSpace(input: CreateSpaceInput!):   Space!
  updateSpace(id: ID!, input: UpdateSpaceInput!): Space!
  deleteSpace(id: ID!):                    Boolean!

  # Fields
  addField(spaceId: ID!, input: FieldInput!): Field!
  addFields(spaceId: ID!, inputs: [FieldInput!]!): [Field!]!
  removeField(fieldId: ID!):               Boolean!
  reorderFields(spaceId: ID!, fieldIds: [ID!]!): [Field!]!
  updateField(fieldId: ID!, input: UpdateFieldInput!): Field!
  changeFieldType(fieldId: ID!, input: ChangeFieldTypeInput!): Field!

  # Views
  createView(spaceId: ID!, input: CreateViewInput!):   View!
  updateView(id: ID!, input: UpdateViewInput!):         View!
  deleteView(id: ID!):                                  Boolean!

  # Relations
  createRelation(input: CreateRelationInput!): Relation!
  deleteRelation(id: ID!):                     Boolean!
  updateRelation(id: ID!, input: UpdateRelationInput!): Relation!
  saveGridColumnPrefs(spaceId: ID!, prefs: JSON!, asDefault: Boolean): Boolean!

  # Custom views (YAML dashboard layouts)
  createCustomView(input: CreateCustomViewInput!): CustomView!
  updateCustomView(id: ID!, input: UpdateCustomViewInput!): CustomView!
  deleteCustomView(id: ID!):                       Boolean!
  addWidgetToView(viewId: ID!, widget: WidgetInput!): CustomView!
  reorderWidgets(pageId: ID!, widgetPositions: [WidgetPosition!]!): CustomView!
  updateWidgetInView(viewId: ID!, widgetId: String!, widget: WidgetInput!): CustomView!
  removeWidgetFromView(viewId: ID!, widgetId: String!): CustomView!

  # Layout export / import
  importLayout(pageId: ID!, yaml: String!): CustomView!

  # Layout snapshots
  createLayoutSnapshot(pageId: ID!, yaml: String!, description: String): LayoutSnapshot!
  restoreLayoutSnapshot(snapshotId: ID!): CustomView!

  # Zone management (Phase 3)
  createZone(pageId: ID!, zoneData: ZoneInput!): Zone!
  resizeZone(pageId: ID!, zoneId: ID!, factor: Float!): Zone!
  mergeZones(pageId: ID!, zoneId1: ID!, zoneId2: ID!): CustomView!
  splitZone(pageId: ID!, zoneId: ID!, direction: String!): CustomView!

  # Data views
  createDataView(input: DataViewInput!): DataView!
  updateDataView(id: ID!, input: DataViewInput!): DataView!
  deleteDataView(id: ID!):               Boolean!
  addDataViewToPage(pageId: ID!, dataViewId: ID!): CustomView!
  createWidgetPlugin(input: CreateWidgetPluginInput!): WidgetPlugin!
  updateWidgetPlugin(id: ID!, input: UpdateWidgetPluginInput!): WidgetPlugin!
  deleteWidgetPlugin(id: ID!): Boolean!

  # Records (CRUD on user-defined spaces)
  insertRecord(spaceId: ID!, data: JSON!):       Record!
  updateRecord(spaceId: ID!, id: ID!, data: JSON!): Record!
  deleteRecord(spaceId: ID!, id: ID!):           Boolean!
  deleteRecords(spaceId: ID!, ids: [ID!]!):      [Boolean!]!
  insertRecords(spaceId: ID!, data: [JSON!]!):   [Record!]!
  updateRecords(spaceId: ID!, records: [RecordUpdateInput!]!): [Record!]!
  restoreRecords(spaceId: ID!, records: [RecordUpdateInput!]!): [Record!]!

  # Auth
  login(username: String!, password: String!):                AuthPayload!
  logout:                                                     Boolean!
  createUser(input: CreateUserInput!):                        User!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  adminSetPassword(userId: ID!, newPassword: String!):        Boolean!

  # Groups & membership
  createGroup(input: CreateGroupInput!):         Group!
  deleteGroup(id: ID!):                          Boolean!
  addMember(userId: ID!, groupId: ID!):          Boolean!
  removeMember(userId: ID!, groupId: ID!):       Boolean!

  # Permissions
  grant(groupId: ID!, input: PermissionInput!):  Permission!
  revoke(permissionId: ID!):                     Boolean!

  # Snapshot import
  importSnapshot(yaml: String!, mode: ImportMode!): ImportResult!

  # App versioning (admin only)
  applyAppUpdate(yaml: String!, decisions: [AppDecisionInput!], allowDowngrade: Boolean): AppApplyReport!
  purgeAppObsolete(appId: String!, keys: [String!]!, confirmed: Boolean!): AppPurgeReport!
}

# ────────────────────────────────────────────────────────────────────────────
# Core types
# ────────────────────────────────────────────────────────────────────────────

type Space {
  id:          ID!
  name:        String!
  description: String
  fields:      [Field!]!
  views:       [View!]!
  records(limit: Int, offset: Int, filter: RecordFilter, reprFormula: String, reprLanguage: String): RecordPage!
  createdAt:   String!
  updatedAt:   String!
}

type Field {
  id:            ID!
  spaceId:       ID!
  name:          String!
  fieldType:     FieldType!
  notNull:       Boolean!
  position:      Int!
  description:   String
  formula:       String
  triggerFields: [String!]
  language:      String
  reprFormula:   String
}

enum FieldType {
  String
  Int
  Float
  Boolean
  ID
  UUID
  Sequence
  Any
  Map
  Array
  Datetime
  Relation  # Alias: handled by frontend as Int + createRelation
}

type View {
  id:        ID!
  spaceId:   ID!
  name:      String!
  viewType:  ViewType!
  config:    JSON
  createdAt: String!
  updatedAt: String!
}

enum ViewType {
  grid
  form
  gallery
}

type Relation {
  id:           ID!
  name:         String!
  fromSpaceId:  ID!
  fromFieldId:  ID!
  toSpaceId:    ID!
  toFieldId:    ID!
  reprFormula:  String
  cardinality:  String
}

type CustomView {
  id:          ID!
  name:        String!
  description: String
  yaml:        String!
  createdAt:   String!
  updatedAt:   String!
}

type LayoutSnapshot {
  id:          ID!
  pageId:      ID!
  yaml:        String!
  createdAt:   Float!
  description: String
}

type DataView {
  id:           ID!
  name:         String!
  description:  String
  sourceSpace:  String!
  config:       String!
  createdAt:    String!
  updatedAt:    String!
}

type WidgetPlugin {
  id:               ID!
  name:             String!
  description:      String
  scriptLanguage:   String!
  templateLanguage: String!
  scriptCode:       String!
  templateCode:     String!
  createdAt:        String!
  updatedAt:        String!
}

# Widget definition for custom views
input WidgetInput {
  title:       String!
  type:        String!
  spaceId:     ID!
  fields:      [String!]!
  groupBy:     String
  params:      JSON
  position:    PositionInput
}

input PositionInput {
  x: Int!
  y: Int!
  w: Int!
  h: Int!
}

# ────────────────────────────────────────────────────────────────────────────
# Records (dynamic data)
# ────────────────────────────────────────────────────────────────────────────

type Record {
  id:   ID!
  data: JSON!
}

type RecordPage {
  items:      [Record!]!
  total:      Int!
  offset:     Int!
  limit:      Int!
}

input RecordUpdateInput {
  id: ID!
  data: JSON!
}

input RecordFilter {
  field:    String
  op:       FilterOp
  value:    String
  formula:  String
  language: String
  and:      [RecordFilter!]
  or:       [RecordFilter!]
}

enum FilterOp {
  EQ
  NEQ
  LT
  GT
  LTE
  GTE
  CONTAINS
  STARTS_WITH
}

# ────────────────────────────────────────────────────────────────────────────
# Auth types
# ────────────────────────────────────────────────────────────────────────────

type AuthPayload {
  token:   String!
  user:    User!
}

type User {
  id:         ID!
  username:   String!
  email:      String!
  groups:     [Group!]!
  createdAt:  String!
}

type Group {
  id:          ID!
  name:        String!
  description: String
  members:     [User!]!
  permissions: [Permission!]!
  createdAt:   String!
}

type Permission {
  id:           ID!
  groupId:      ID!
  resourceType: String!
  resourceId:   ID!
  level:        PermissionLevel!
}

enum PermissionLevel {
  read
  write
  admin
}

# ────────────────────────────────────────────────────────────────────────────
# Input types
# ────────────────────────────────────────────────────────────────────────────

input UpdateFieldInput {
  name:          String
  notNull:       Boolean
  description:   String
  formula:       String
  triggerFields: [String!]
  language:      String
  reprFormula:   String
}

input CreateSpaceInput {
  name:        String!
  description: String
}

input UpdateSpaceInput {
  name:        String
  description: String
}

input FieldInput {
  name:          String!
  fieldType:     FieldType!
  notNull:       Boolean
  description:   String
  formula:       String
  triggerFields: [String!]
  language:      String
  reprFormula:   String
}

input ChangeFieldTypeInput {
  fieldType:        FieldType!
  conversionFormula: String
  language:          String
}

input CreateViewInput {
  name:      String!
  viewType:  ViewType!
  config:    JSON
}

input UpdateViewInput {
  name:      String
  viewType:  ViewType
  config:    JSON
}

input CreateRelationInput {
  name:        String!
  fromSpaceId: ID!
  fromFieldId: ID!
  toSpaceId:   ID!
  toFieldId:   ID!
  reprFormula: String
  cardinality: String
}

input UpdateRelationInput {
  reprFormula: String
  cardinality: String
}

input CreateCustomViewInput {
  name:        String!
  description: String
  yaml:        String!
}

input UpdateCustomViewInput {
  name:        String
  description: String
  yaml:        String
}

input DataViewInput {
  name:         String!
  description:  String
  sourceSpace:  String!
  config:       String
}

input CreateWidgetPluginInput {
  name:             String!
  description:      String
  scriptLanguage:   String
  templateLanguage: String
  scriptCode:       String!
  templateCode:     String!
}

input UpdateWidgetPluginInput {
  name:             String
  description:      String
  scriptLanguage:   String
  templateLanguage: String
  scriptCode:       String
  templateCode:     String
}

input CreateUserInput {
  username: String!
  email:    String!
  password: String!
}

input CreateGroupInput {
  name:        String!
  description: String
}

input PermissionInput {
  resourceType: String!
  resourceId:   ID
  level:        PermissionLevel!
}

# ────────────────────────────────────────────────────────────────────────────
# Scalar: JSON (opaque pass-through)
# ────────────────────────────────────────────────────────────────────────────

scalar JSON

scalar Any

scalar Datetime

# ────────────────────────────────────────────────────────────────────────────
# Aggregation
# ────────────────────────────────────────────────────────────────────────────

input AggregateInput {
  field: String   # champ à agréger (absent = COUNT(*))
  fn:    String!  # sum | count | avg | min | max
  as:    String   # alias colonne résultat (optionnel, défaut auto : fn_field)
}

# ────────────────────────────────────────────────────────────────────────────
# Snapshot export / import
# ────────────────────────────────────────────────────────────────────────────

enum ImportMode {
  merge    # crée le manquant, ignore l'existant (idempotent)
  replace  # supprime tout puis recrée (destructif)
}

type ImportResult {
  ok:      Boolean!
  created: Int!
  skipped: Int!
  errors:  [String!]!
}

type FieldDiff {
  space:   String!
  field:   String!
  oldType: String
  newType: String
}

type SnapshotDiff {
  spacesToCreate:       [String!]!
  spacesToDelete:       [String!]!
  fieldsToCreate:       [FieldDiff!]!
  fieldsToDelete:       [FieldDiff!]!
  fieldsToChange:       [FieldDiff!]!
  pagesToCreate:        [String!]!
  pagesToUpdate:        [String!]!
  widgetPluginsToCreate: [String!]!
  widgetPluginsToUpdate: [String!]!
}

# ────────────────────────────────────────────────────────────────────────────
# App versioning
# ────────────────────────────────────────────────────────────────────────────

input AppMetaInput {
  id:          String!
  name:        String
  version:     String!
  description: String
}

input AppSeedInput {
  space:    String!
  keyField: String!
}

input AppDecisionInput {
  key:    String!
  choice: String!
}

type AppInfo {
  appId:         String!
  name:          String!
  version:       String!
  installedAt:   Float!
  source:        String!
  activeCount:   Int!
  obsoleteCount: Int!
}

type AppItem {
  key:     String!
  type:    String!
  state:   String!
  version: String
}

type AppPlanItem {
  key:         String!
  type:        String!
  content:     JSON
  fingerprint: String
  isCode:      Boolean!
}

type AppConflict {
  key:       String!
  type:      String!
  local:     JSON
  delivered: JSON
}

type AppRename {
  from: String!
  to:   String!
}

type AppPlan {
  create:    [AppPlanItem!]!
  update:    [AppPlanItem!]!
  conflict:  [AppConflict!]!
  keepLocal: [AppPlanItem!]!
  obsolete:  [String!]!
  rename:    [AppRename!]!
  unchanged: [String!]!
  errors:    [String!]!
}

type AppApplyReport {
  ok:        Boolean!
  created:   [String!]!
  updated:   [String!]!
  kept:      [String!]!
  unchanged: [String!]!
  obsolete:  [String!]!
  skipped:   [String!]!
  error:     String
}

type AppLoss {
  key:       String!
  type:      String!
  records:   Int!
  fields:    Int!
  relations: Int!
  views:     Int!
}

type AppPurgePreview {
  losses:       [AppLoss!]!
  totalRecords: Int!
}

type AppPurgeReport {
  ok:     Boolean!
  purged: [String!]!
  error:  String
}

input WidgetPosition {
  widgetId: String!
  index: Int!
  parentId: String  # ID de la zone parente (null pour racine)
}

# Zone types (Phase 3)
type Zone {
  id: ID!
  title: String!
  factor: Float!
  direction: String!
  children: [LayoutChild!]!
}

input ZoneInput {
  title: String!
  factor: Float
  direction: String
}
